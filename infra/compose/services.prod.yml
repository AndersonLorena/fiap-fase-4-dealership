# Production Compose: app image comes from GHCR (no local build).
# Join the account stack network (fiapf3-prod-net). Start fiap-fase-4-system first.
name: fiapf3-dealership-prod

services:
  dealership-postgresql:
    # LTS used to run the project: PostgreSQL 16 (community support until Nov 2028). Tag postgres:16-alpine tracks 16.x.
    image: postgres:16-alpine
    container_name: fiapf3-prod-dealership-postgresql
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    networks:
      - fiapf3-dealership-prod-net
    volumes:
      - fiapf3-prod-dealership-postgresql-data:/var/lib/postgresql/data
      - ../confs/postgresql/initdb.d:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: fiapf3
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiapf3}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: America/Sao_Paulo
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=80
      - -c
      - effective_cache_size=384MB
      - -c
      - listen_addresses=*
      - -c
      - track_activities=on
      - -c
      - track_counts=on
      - -c
      - track_io_timing=on
      - -c
      - track_functions=all
      - -c
      - track_activity_query_size=2048
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=10485760
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=1000
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapf3 -d postgres"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  dealership:
    # LTS used to run the project: Eclipse Temurin Java 21 (Dockerfile runtime; Temurin support until at least Dec 2029).
    image: ghcr.io/${GHCR_OWNER}/fiapf3-dealership:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: fiapf3-prod-dealership
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    networks:
      - fiapf3-dealership-prod-net
      - fiapf3-prod-net
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      TZ: America/Sao_Paulo
      DB_URL: jdbc:postgresql://dealership-postgresql:5432/fiapf3_dealership
      DB_USERNAME: fiapf3
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fiapf3}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-fiapf3}
      GARAGE_ENDPOINT: ${GARAGE_ENDPOINT:-http://garage:3900}
      GARAGE_PUBLIC_ENDPOINT: ${GARAGE_PUBLIC_ENDPOINT:-http://localhost}
      GARAGE_REGION: garage
      GARAGE_BUCKET: ${GARAGE_BUCKET:-fiapf3-vehicle-photos}
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      UPLOAD_INTENT_SECRET: ${UPLOAD_INTENT_SECRET}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-fiap-car-sales}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_DEALERSHIP_CLIENT_ID:-dealership-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_DEALERSHIP_CLIENT_SECRET}
      ACCOUNT_API_URL: ${ACCOUNT_API_URL:-http://account:8080}
      DEALERSHIP_PAYMENT_ALLOWED_CLIENT_IDS: ${DEALERSHIP_PAYMENT_ALLOWED_CLIENT_IDS:-payment-processor}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
    depends_on:
      dealership-postgresql:
        condition: service_healthy

networks:
  fiapf3-dealership-prod-net:
    driver: bridge
    name: fiapf3-dealership-prod-net
  fiapf3-prod-net:
    external: true
    name: fiapf3-prod-net

volumes:
  fiapf3-prod-dealership-postgresql-data:
    name: fiapf3-prod-dealership-postgresql-data
