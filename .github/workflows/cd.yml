name: CD — Publish GHCR

on:
  push:
    branches: [main]
    paths:
      - 'backends/dealership-api/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

concurrency:
  group: cd-ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-dealership:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backends/dealership-api
          file: backends/dealership-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/fiapf3-dealership:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/fiapf3-dealership:${{ github.sha }}
          cache-from: type=gha,scope=fiapf3-dealership
          cache-to: type=gha,mode=max,scope=fiapf3-dealership
